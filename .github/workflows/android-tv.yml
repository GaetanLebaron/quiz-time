# Compile l'appli Android TV (dossier android-tv) et met l'APK à disposition
# dans l'onglet Actions. Ne touche pas au site ni à sa mise en ligne.
name: APK Android TV

on:
  push:
    paths:
      - 'android-tv/**'
      - '.github/workflows/android-tv.yml'
  pull_request:
    paths:
      - 'android-tv/**'
      - '.github/workflows/android-tv.yml'
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-tv
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Compiler l'APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk quiz-time-tv.apk

      - uses: actions/upload-artifact@v4
        with:
          name: quiz-time-tv
          path: android-tv/quiz-time-tv.apk
          if-no-files-found: error
