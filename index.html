<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quiz Time – Quiz Time</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0820;--pink:#ff3cac;--cyan:#35f0ff;--green:#4dff9d;--ink:#f4f0ff;--mut:#a39ccf;--card:rgba(20,13,52,.85);--line:rgba(255,255,255,.12);
color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100vh;color:var(--ink);font-family:'Fredoka',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:17px;
background:radial-gradient(ellipse at 50% -10%,#3b1170 0,transparent 60%),repeating-linear-gradient(0deg,transparent 0 37px,rgba(255,255,255,.035) 37px 39px),var(--bg)}
.wrap{max-width:1120px;margin:0 auto;padding:20px 18px 40px}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.brand{font-size:2rem;font-weight:700;margin:0;color:var(--pink);text-shadow:0 0 6px rgba(255,60,172,.5)}
.brand span{color:var(--cyan);text-shadow:0 0 6px rgba(53,240,255,.5)}
.sub{color:var(--mut);font-size:.95rem}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:24px;backdrop-filter:blur(4px)}
.setup{display:grid;gap:22px;max-width:640px;margin:0 auto}
h2,h3{margin:0}
h3{font-size:1.1rem;color:var(--cyan);margin-bottom:10px;text-shadow:0 0 6px rgba(53,240,255,.3)}
.row{display:flex;gap:8px;margin-bottom:8px}
input[type=text],input[type=number]{flex:1;min-width:0;background:#120c34;border:1.5px solid var(--line);border-radius:10px;color:var(--ink);font:inherit;padding:10px 12px}
input:focus,button:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
input[type=number]{max-width:110px;flex:none}
.btn{--c:var(--cyan);font:inherit;font-weight:500;cursor:pointer;background:transparent;color:var(--c);border:2px solid var(--c);border-radius:12px;padding:12px 18px;
text-shadow:0 0 4px color-mix(in srgb,var(--c) 45%,transparent);box-shadow:0 0 8px -4px var(--c);transition:background .15s,color .15s}
.btn:hover{background:var(--c);color:#0a0820;text-shadow:none}
.btn.pink{--c:var(--pink)}.btn.green{--c:var(--green)}.btn.mut{--c:#8d86c4;box-shadow:none;text-shadow:none}
.btn.big{font-size:1.2rem;padding:15px 22px;width:100%}
.x{padding:8px 13px;--c:#8d86c4;box-shadow:none;text-shadow:none}
.lv{display:flex;gap:8px;flex-wrap:wrap}
.lv button{flex:1;min-width:92px;display:flex;flex-direction:column;align-items:center;gap:2px;line-height:1.2}
.lv button.on{background:var(--c);color:#0a0820;text-shadow:none}
.lv b{font-size:1.3rem}.lv i{font-style:normal;font-size:.8rem}
.grid{display:grid;grid-template-columns:1fr 320px;gap:20px;align-items:start}
.bar{display:flex;align-items:center;gap:12px;color:var(--mut)}
.dots{display:flex;gap:5px}.dots i{width:10px;height:10px;border-radius:50%;background:#2c2560}.dots i.d{background:var(--cyan);box-shadow:0 0 4px var(--cyan)}.dots i.c{background:var(--pink);box-shadow:0 0 4px var(--pink)}
.ctx{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.who{font-size:2rem;font-weight:700;line-height:1.1}.who span{display:block;font-size:.9rem;font-weight:400;color:var(--mut)}
.theme{--c:var(--cyan);border:2px solid var(--c);color:var(--c);border-radius:999px;padding:8px 18px;font-weight:600;text-shadow:0 0 4px color-mix(in srgb,var(--c) 45%,transparent);box-shadow:0 0 8px -4px var(--c)}
.q{font-size:clamp(1.5rem,3.4vw,2.2rem);line-height:1.25;margin:6px 0 14px;font-weight:600}
.lvl{color:var(--mut);font-size:.9rem;margin:0}
.exp{margin:0 0 18px;color:var(--mut);font-size:.95rem}.exp b{color:var(--green);font-weight:600}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}
.opt{border:1.5px solid var(--line);border-radius:12px;padding:14px;background:#120c34;font-weight:500;transition:opacity .3s}
.opt.ok{border-color:var(--green);color:var(--green);box-shadow:0 0 8px -3px var(--green)}
.opt.off{opacity:.12;text-decoration:line-through}
.acts{display:grid;gap:10px}.acts.three{grid-template-columns:1fr}
.anec{border-left:4px solid var(--pink);background:rgba(255,60,172,.08);border-radius:0 12px 12px 0;padding:14px 16px;margin-bottom:16px}
.anec p{margin:4px 0 0;color:var(--ink)}.anec b{color:var(--pink)}
.score h3{color:var(--pink);text-shadow:0 0 6px rgba(255,60,172,.3)}
.score ol{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.score li{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);background:#120c34}
.score li.cur{border-color:var(--cyan);box-shadow:0 0 8px -4px var(--cyan)}
.score .rk{width:26px;color:var(--mut);font-weight:600}.score .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.score .pt{font-weight:700;font-size:1.3rem;color:var(--cyan)}
.end{text-align:center;max-width:620px;margin:0 auto}
.win{font-size:2.6rem;font-weight:700;margin:6px 0 20px;color:var(--cyan);text-shadow:0 0 8px rgba(53,240,255,.45)}
@media(max-width:820px){.grid{grid-template-columns:1fr}.opts{grid-template-columns:1fr}.who{font-size:1.6rem}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

body.tv{font-size:22px}body.tv .wrap{max-width:1500px}
.tvwait{text-align:center;display:grid;gap:14px;justify-items:center;padding-top:6px}
.hero{font-size:clamp(3rem,8vw,6rem);margin:0;font-weight:700;color:var(--pink);text-shadow:0 0 6px rgba(255,60,172,.5)}.hero span{color:var(--cyan);text-shadow:0 0 6px rgba(53,240,255,.5)}
.qr{background:#fff;padding:14px;border-radius:16px;line-height:0}.qr img{width:min(60vw,300px);image-rendering:pixelated}
.url{color:var(--mut);font-size:.8rem;word-break:break-all;max-width:700px;margin:0}
.st{font-weight:600}.st.on{color:var(--green)}
body.tv .grid{grid-template-columns:1fr 360px}body.tv .q{font-size:clamp(2rem,4.2vw,3.4rem)}body.tv .opt{font-size:1.4rem;padding:20px}
.res{font-size:1.7rem;font-weight:700;border-radius:14px;padding:14px 18px;margin-bottom:14px;animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
.res.good{color:var(--green);border:2px solid var(--green);background:rgba(77,255,157,.1)}
.res.bad{color:var(--pink);border:2px solid var(--pink);background:rgba(255,60,172,.1);animation:shake .5s}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes shake{20%{transform:translateX(-12px)}40%{transform:translateX(12px)}60%{transform:translateX(-8px)}80%{transform:translateX(8px)}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 class="brand">Quiz <span>Time</span></h1>
    <div class="sub" id="meta"></div>
  </header>
  <div id="app"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script>
const THEMES=[
 {n:'Géographie',e:'🌍',c:'#35f0ff'},{n:'Divertissements',e:'🎬',c:'#ff3cac'},{n:'Histoire',e:'🏛️',c:'#ffd23c'},
 {n:'Arts et Littérature',e:'🎨',c:'#b88cff'},{n:'Sciences et Nature',e:'🔬',c:'#4dff9d'},{n:'Sports et Loisirs',e:'⚽',c:'#ff8a3c'}];
const LV=['Très facile','Facile','Moyen','Difficile','Expert'];
/* [thème, modèle de question (% = sujet), question sur une année ?, ["niveau|sujet|réponse|anecdote", ...]] */
const D=[
[0,"Quelle est la capitale de % ?",0,["1|l'Italie|Rome|Rome est surnommée la Ville éternelle.","1|l'Espagne|Madrid|Madrid est la plus haute capitale de l'Union européenne.","2|le Canada|Ottawa|Toronto et Montréal sont plus peuplées qu'Ottawa.","3|l'Australie|Canberra|Canberra a été créée pour éviter la rivalité Sydney-Melbourne.","4|le Kazakhstan|Astana|La capitale a changé de nom plusieurs fois.","5|le Bhoutan|Thimphou|Thimphou n'a aucun feu tricolore."]],
[0,"Quel fleuve traverse % ?",0,["1|Paris|la Seine|La Seine fait 777 km, de la Bourgogne à la Manche.","1|Londres|la Tamise|Le Tower Bridge enjambe la Tamise.","2|Le Caire|le Nil|Le Nil est l'un des plus longs fleuves du monde.","3|Budapest|le Danube|Le Danube traverse dix pays.","4|Bagdad|le Tigre|Le Tigre et l'Euphrate bordent l'ancienne Mésopotamie.","5|Kinshasa|le Congo|Le Congo est le fleuve le plus profond du monde."]],
[1,"Qui a réalisé « % » ?",0,["1|Titanic|James Cameron|Le film a remporté 11 Oscars en 1998.","2|Pulp Fiction|Quentin Tarantino|Palme d'or à Cannes en 1994.","2|Inception|Christopher Nolan|Le film joue sur des rêves imbriqués.","3|Les Dents de la mer|Steven Spielberg|Premier grand blockbuster d'été, en 1975.","4|Le Cinquième Élément|Luc Besson|Jean-Paul Gaultier a signé les costumes.","5|Mulholland Drive|David Lynch|Prix de la mise en scène à Cannes en 2001."]],
[1,"Quel groupe a chanté « % » ?",0,["1|Bohemian Rhapsody|Queen|La chanson dure près de six minutes.","2|Hotel California|Eagles|Sortie en 1976, elle est devenue un classique du rock.","2|Satisfaction|The Rolling Stones|Keith Richards a trouvé le riff en rêve.","3|Smells Like Teen Spirit|Nirvana|Le titre vient d'une marque de déodorant.","4|Wish You Were Here|Pink Floyd|Hommage à Syd Barrett, membre fondateur.","5|Paranoid Android|Radiohead|Elle change trois fois de rythme."]],
[2,"En quelle année % ?",1,["1|débute la Révolution française|1789|La prise de la Bastille a eu lieu le 14 juillet.","1|l'homme marche pour la première fois sur la Lune|1969|Neil Armstrong a posé le pied sur la Lune le 21 juillet.","2|tombe le mur de Berlin|1989|Il séparait la ville depuis 1961.","3|Christophe Colomb atteint l'Amérique|1492|Il cherchait une route vers les Indes.","3|se termine la Première Guerre mondiale|1918|L'armistice est signé le 11 novembre.","4|a lieu la bataille de Marignan|1515|C'est une victoire de François Ier.","5|est signé le traité de Westphalie|1648|Il met fin à la guerre de Trente Ans."]],
[2,"Qui était surnommé « % » ?",0,["1|Le Roi-Soleil|Louis XIV|Il a fait construire le château de Versailles.","2|Le Petit Caporal|Napoléon Ier|Il aimait se mêler à ses soldats.","3|La Dame de fer|Margaret Thatcher|Elle a dirigé le Royaume-Uni de 1979 à 1990.","3|Le Tigre|Georges Clemenceau|On l'appelle aussi le Père la Victoire.","4|Le Roi Bourgeois|Louis-Philippe Ier|Il a régné de 1830 à 1848.","5|L'Aigle de Meaux|Bossuet|Évêque et grand orateur du XVIIe siècle."]],
[3,"Qui a écrit « % » ?",0,["1|Les Misérables|Victor Hugo|Le roman a paru en 1862.","1|Le Petit Prince|Antoine de Saint-Exupéry|C'est l'une des œuvres françaises les plus traduites.","2|Madame Bovary|Gustave Flaubert|Le roman a valu un procès à son auteur en 1857.","3|L'Étranger|Albert Camus|Il s'ouvre sur la mort de la mère du narrateur.","4|Le Rouge et le Noir|Stendhal|Stendhal est le pseudonyme d'Henri Beyle.","5|Ulysse|James Joyce|L'action se déroule en une seule journée, à Dublin."]],
[3,"Qui a peint « % » ?",0,["1|La Joconde|Léonard de Vinci|Elle est exposée au Louvre.","2|La Nuit étoilée|Vincent van Gogh|Il l'a peinte depuis l'asile de Saint-Rémy-de-Provence.","2|Guernica|Pablo Picasso|Elle dénonce le bombardement d'une ville basque en 1937.","3|Impression, soleil levant|Claude Monet|Ce tableau a donné son nom à l'impressionnisme.","4|Les Ménines|Diego Vélasquez|Le peintre s'y est représenté lui-même.","5|Le Jardin des délices|Jérôme Bosch|Ce triptyque est conservé au musée du Prado."]],
[4,"Quel est le symbole chimique de % ?",0,["1|l'oxygène|O|L'oxygène représente environ 21 % de l'air.","1|l'or|Au|Au vient du latin aurum.","2|le sodium|Na|Na vient du latin natrium.","3|le potassium|K|K vient du latin kalium.","4|le tungstène|W|W vient de wolfram, son autre nom.","5|l'antimoine|Sb|Sb vient du latin stibium."]],
[4,"Quel animal % ?",0,["1|est le plus rapide sur terre|Le guépard|Il atteint 110 km/h en pointe.","2|produit le miel|L'abeille|Une abeille ne produit qu'une infime quantité de miel dans sa vie.","2|est le plus grand du monde|La baleine bleue|Elle peut dépasser 30 mètres de long.","3|possède trois cœurs|La pieuvre|Son sang est bleu.","4|est un mammifère qui pond des œufs|L'ornithorynque|Il vit en Australie.","5|est un poisson surnommé « fossile vivant »|Le cœlacanthe|On le croyait disparu depuis 66 millions d'années."]],
[5,"Quel sport utilise % ?",0,["1|un ballon ovale|Le rugby|Le rugby serait né en 1823 à Rugby, en Angleterre.","1|un volant|Le badminton|Un volant peut dépasser 400 km/h au smash.","2|un palet|Le hockey sur glace|Le palet est en caoutchouc vulcanisé.","3|des bunkers et des greens|Le golf|Un parcours compte 18 trous.","4|un shinai|Le kendo|Le shinai est un sabre de bambou.","5|une chistera|La pelote basque|Elle sert à lancer la balle contre le mur."]],
[5,"Dans quelle ville se sont déroulés les JO de % ?",0,["1|2024|Paris|Paris accueille les JO d'été pour la troisième fois.","2|2016|Rio de Janeiro|Premiers JO organisés en Amérique du Sud.","2|2012|Londres|Londres est la première ville à les avoir accueillis trois fois.","3|2008|Pékin|La cérémonie d'ouverture a débuté le 08/08/08 à 8 h 08.","4|1992|Barcelone|Le stade de Montjuïc a servi de cadre aux épreuves.","5|1980|Moscou|De nombreux pays ont boycotté ces Jeux."]]
];
const Q=[];
D.forEach(([th,tpl,yr,list],g)=>list.forEach(s=>{const[l,sub,a,f]=s.split('|');Q.push({th,g,yr,l:+l,q:tpl.replace('%',sub),a,f})}));


const JOIN=new URLSearchParams(location.search).get('join');
const TV=!JOIN;document.body.classList.toggle('tv',TV);
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const plural=(n,w)=>n+' '+w+(n>1?'s':'');
let cfg={teams:['Équipe 1','Équipe 2'],rounds:5,level:2};
let S=null,st=null,scr=TV?'wait':'conn',conn=null,peer=null,joinUrl='',err='';

/* ---------- Moteur (écran TV uniquement) ---------- */
function pick(th){
  const pool=Q.filter(q=>q.th==th);let c=pool.filter(q=>!S.used.has(q));
  if(!c.length){pool.forEach(q=>S.used.delete(q));c=pool}
  const d=Math.min(...c.map(q=>Math.abs(q.l-S.level)));
  const r=c.filter(q=>Math.abs(q.l-S.level)==d);
  const q=r[Math.random()*r.length|0];S.used.add(q);return q;
}
function mkOpts(q){
  let w;
  if(q.yr){const s=new Set();while(s.size<3){const o=+q.a+(Math.random()*40-20|0);if(o>0&&String(o)!=q.a)s.add(String(o))}w=[...s]}
  else w=shuf(Q.filter(x=>x.g==q.g&&x.a!=q.a).map(x=>x.a)).slice(0,3);
  return shuf([q.a,...w]);
}

function startGame(c){
  const teams=(c.teams||[]).map(n=>String(n).trim().slice(0,24)).filter(Boolean).slice(0,8);
  if(teams.length<2)return;
  const rounds=Math.max(1,Math.min(30,+c.rounds||5)),level=Math.max(1,Math.min(5,+c.level||2));
  const bag=[];while(bag.length<rounds)bag.push(...shuf(THEMES.map((_,i)=>i)));
  S={gid:Date.now(),date:Date.now(),teams:teams.map(n=>({n,s:0})),rounds,level,themes:bag.slice(0,rounds),round:0,ti:0,used:new Set(),phase:'q',opts:null,hid:[],pts:0};
  S.q=pick(S.themes[0]);scr='game';
}
function next(){
  S.ti++;if(S.ti>=S.teams.length){S.ti=0;S.round++}
  if(S.round>=S.rounds){scr='end';return}
  S.q=pick(S.themes[S.round]);S.opts=null;S.hid=[];S.phase='q';
}
const pub=()=>S&&{teams:S.teams,rounds:S.rounds,round:S.round,ti:S.ti,level:S.level,th:S.themes[S.round],q:{q:S.q.q,a:S.q.a,l:S.q.l,f:S.q.f},phase:S.phase,opts:S.opts,hid:S.hid,pts:S.pts,last:S.round==S.rounds-1&&S.ti==S.teams.length-1};
function onCmd(m){
  if(m.t=='start')startGame(m.cfg||{});
  else if(m.t=='replay'||m.t=='pause'){saveS();S=null;scr='cfgd';lsSet(CK,null)}
  else if(m.t=='resume'){const g=findG(m.p);if(g&&g.scr!='end'){saveS();restore(g)}}
  else if(m.t=='del'){lsSet(GK,(lsGet(GK)||[]).filter(g=>g.id!=m.p))}
  else if(S&&m.t=='show'&&S.phase=='q'){S.opts=mkOpts(S.q);S.phase='m'}
  else if(S&&m.t=='fifty'&&S.phase=='m'){S.hid=shuf(S.opts.filter(o=>o!=S.q.a)).slice(0,2);S.phase='f'}
  else if(S&&m.t=='ans'&&S.phase!='r'&&[0,1,3,5].includes(m.p)){S.teams[S.ti].s+=m.p;S.pts=m.p;S.phase='r'}
  else if(S&&m.t=='next'&&S.phase=='r')next();
  saveS();push();render();
}
let tvOk=false,pOk=false,cOk=false;const t0=Date.now();
const GK='quiz-time-games',CK='quiz-time-cur';let gl=[];
const lsGet=k=>{try{return JSON.parse(localStorage.getItem(k)||'null')}catch(e){return null}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
function saveS(){
  if(!S)return;
  const g={id:S.gid,date:S.date,scr,S:{...S,q:Q.indexOf(S.q),used:[...S.used].map(q=>Q.indexOf(q))}};
  lsSet(GK,[g,...(lsGet(GK)||[]).filter(x=>x.id!=S.gid)].slice(0,10));lsSet(CK,S.gid);
}
function restore(g){
  if(!g||!g.S||!Q[g.S.q])return;
  S=g.S;S.q=Q[S.q];S.used=new Set(S.used.map(i=>Q[i]));scr=g.scr;
}
const findG=id=>(lsGet(GK)||[]).find(g=>g.id==id);
const loadS=()=>restore(findG(lsGet(CK)));
const gsum=()=>(lsGet(GK)||[]).map(g=>({id:g.id,date:g.date,rounds:g.S.rounds,round:g.S.round,done:g.scr=='end',teams:g.S.teams}));
const qrURL=()=>{try{const q=qrcode(0,'M');q.addData(joinUrl);q.make();return q.createDataURL(6,2)}catch(e){return''}};
const lostBar=()=>conn?'':`<div class="anec" style="display:flex;align-items:center;gap:16px"><img alt="QR code" style="width:110px;border-radius:8px;background:#fff;padding:6px" src="${qrURL()}"><span>Maître du Jeu déconnecté. Il peut rescanner ce QR code ou recharger sa page : la partie est conservée.</span></div>`;
const BASE='https://ntfy.sh/';
const T=TV?(()=>{let id=null;try{id=localStorage.getItem('qt-id2')}catch(e){}if(!id){id='qt'+Array.from(crypto.getRandomValues(new Uint8Array(14)),b=>(b%36).toString(36)).join('');try{localStorage.setItem('qt-id2',id)}catch(e){}}return id})():JOIN;
const OUT=BASE+T+(TV?'s':'c'),IN=BASE+T+(TV?'c':'s');
const say=m=>{fetch(OUT,{method:'POST',body:JSON.stringify(m)}).catch(()=>{})};
function listen(h,st){
  const es=new EventSource(IN+'/sse');
  es.onopen=()=>st(true);es.onerror=()=>st(false);
  es.onmessage=e=>{try{const d=JSON.parse(e.data);if(d.event&&d.event!='message')return;h(JSON.parse(d.message))}catch(x){}};
}
const push=ask=>{say({k:'s',scr,s:pub(),ask:ask===true});if(scr=='cfgd')say({k:'g',g:gsum().slice(0,6)})};
function tvInit(){
  joinUrl=location.href.split('#')[0].split('?')[0]+'?join='+T;
  listen(m=>{conn=true;if(m.t=='hello'&&!S)scr='cfgd';onCmd(m)},ok=>{tvOk=ok;render()});
  if(S)push(true);
}
function ctlInit(){
  listen(d=>{
    if(d.k=='s'){cOk=true;scr=d.scr;st=d.s;if(d.ask)say({t:'hello'})}
    else if(d.k=='g')gl=d.g||[];
    render();
  },ok=>{pOk=ok;if(ok)say({t:'hello'});render()});
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)say({t:'hello'})});
}
const cmd=(t,p)=>say({t,p});
function go(){
  if(cfg.teams.map(n=>n.trim()).filter(Boolean).length<2){alert('Ajoutez au moins deux équipes.');return}
  say({t:'start',cfg});
}

/* ---------- Vues ---------- */
function renderSetup(){
  $('#meta').textContent='Console du Maître du Jeu · '+Q.length+' questions en banque';
  return `<div class="setup">
  <section class="card"><h3>Équipes</h3>
    ${cfg.teams.map((t,i)=>`<div class="row"><input type="text" value="${esc(t)}" maxlength="24" aria-label="Nom de l'équipe ${i+1}" oninput="cfg.teams[${i}]=this.value"><button class="btn x" onclick="rmTeam(${i})" aria-label="Retirer l'équipe">✕</button></div>`).join('')}
    <button class="btn mut" onclick="addTeam()" ${cfg.teams.length>=8?'disabled':''}>+ Ajouter une équipe</button>
  </section>
  <section class="card"><h3>Nombre de tours</h3>
    <div class="row" style="align-items:center"><input type="number" min="1" max="30" value="${cfg.rounds}" aria-label="Nombre de tours" oninput="cfg.rounds=Math.max(1,Math.min(30,+this.value||1))"><span class="sub">Un tour = une question par équipe</span></div>
  </section>
  <section class="card"><h3>Niveau de difficulté</h3>
    <div class="lv">${LV.map((l,i)=>`<button class="btn ${cfg.level==i+1?'on':''}" onclick="cfg.level=${i+1};render()"><b>${i+1}</b><i>${l}</i></button>`).join('')}</div>
  </section>
  <button class="btn pink big" onclick="go()">Lancer la partie</button>${savedHTML()}</div>`;
}
const addTeam=()=>{cfg.teams.push('Équipe '+(cfg.teams.length+1));render()};
const rmTeam=i=>{if(cfg.teams.length>2){cfg.teams.splice(i,1);render()}};


const fmtD=t=>new Date(t).toLocaleString('fr-FR',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
function savedHTML(){
  if(!gl.length)return'';
  const row=g=>`<div class="anec" style="margin:0"><b>${fmtD(g.date)} · ${g.done?'Terminée':'Tour '+(g.round+1)+' / '+g.rounds}</b><p>${[...g.teams].sort((a,b)=>b.s-a.s).map(t=>esc(t.n)+' '+t.s).join(' · ')}</p><div class="row" style="margin:8px 0 0">${g.done?'':`<button class="btn" onclick="cmd('resume',${g.id})">Reprendre</button>`}<button class="btn x" onclick="if(confirm('Supprimer cette partie ?'))cmd('del',${g.id})">Supprimer</button></div></div>`;
  return `<section class="card"><h3>Parties enregistrées</h3><div style="display:grid;gap:10px">${gl.map(row).join('')}</div></section>`;
}
function board(st,cur){
  const r=st.teams.map((t,i)=>({...t,i})).sort((a,b)=>b.s-a.s||a.i-b.i);
  return `<aside class="card score"><h3>Classement</h3><ol>${r.map((t,k)=>`<li class="${cur&&t.i==st.i0?'cur':''}"><span class="rk">${k+1}</span><span class="nm">${esc(t.n)}</span><span class="pt">${t.s}</span></li>`).join('')}</ol></aside>`;
}
function head(st){
  const th=THEMES[st.th],dots=Array.from({length:st.rounds},(_,i)=>`<i class="${i<st.round?'d':i==st.round?'c':''}"></i>`).join('');
  return `<div class="bar" style="margin-bottom:16px"><span>Tour ${st.round+1} / ${st.rounds}</span><span class="dots">${dots}</span></div>
  <div class="ctx"><div class="who"><span>Au tour de</span>${esc(st.teams[st.ti].n)}</div><div class="theme" style="--c:${th.c}">${th.e} ${th.n}</div></div>`;
}
function optsHTML(st,mark){
  return st.opts?`<div class="opts">${st.opts.map((o,i)=>`<div class="opt ${mark&&o==st.q.a?'ok':''} ${st.hid.includes(o)?'off':''}">${'ABCD'[i]}. ${esc(o)}${mark&&o==st.q.a?' ✓':''}</div>`).join('')}</div>`:'';
}
const verdict=st=>st.pts?`<div class="res good">Bonne réponse ! +${plural(st.pts,'point')}</div>`:`<div class="res bad">Mauvaise réponse · c'était : ${esc(st.q.a)}</div>`;
function endHTML(st,ctl){
  const top=Math.max(...st.teams.map(t=>t.s)),w=st.teams.filter(t=>t.s==top).map(t=>t.n);
  return `<div class="end"><p class="sub">${w.length>1?'Égalité entre':'Victoire de'}</p><div class="win">🏆 ${esc(w.join(' & '))}</div>
  <div style="text-align:left;margin-bottom:20px">${board({...st,i0:-1},false)}</div>${ctl?'<button class="btn pink big" onclick="cmd(\'replay\')">Nouvelle partie</button>':''}</div>`;
}
function tvWait(){
  let qr='';
  if(joinUrl&&typeof qrcode!='undefined'){const q=qrcode(0,'M');q.addData(joinUrl);q.make();qr=`<div class="qr"><img alt="QR code pour rejoindre la partie" src="${q.createDataURL(8,2)}"></div>`}
  const s=conn?'<p class="st on">✓ Maître du Jeu connecté · configuration en cours sur son téléphone</p>':'<p class="st sub">En attente du Maître du Jeu…</p>'+`<p class="st sub" style="font-size:.85rem">Serveur de connexion : ${tvOk?'✓ joint':'en cours (si cela dure, le réseau le bloque)…'}</p>`;
  return `<div class="tvwait"><h2 class="hero">Quiz <span>Time</span></h2>${qr||`<p class="sub">QR code indisponible : bibliothèque non chargée. Ouvrez l'adresse ci-dessous sur le téléphone.</p>`}
  <p style="font-size:1.4rem;margin:0">Scannez ce QR code avec le smartphone du Maître du Jeu</p>${s}${err?`<p class="st" style="color:var(--pink)">${esc(err)}</p>`:''}<p class="url">${esc(joinUrl)}</p></div>`;
}
function tvGame(st){
  const q=st.q,r=st.phase=='r';
  return `<div class="grid"><main>${head(st)}<section class="card"><p class="lvl">Niveau ${q.l} · ${LV[q.l-1]}</p><h2 class="q">${esc(q.q)}</h2>${optsHTML(st,r)}
  ${r?`${verdict(st)}<div class="anec"><b>Réponse : ${esc(q.a)}</b><p>Le saviez-vous ? ${esc(q.f)}</p></div>`:''}</section></main>${board({...st,i0:st.ti},true)}</div>`;
}
function ctlGame(st){
  const q=st.q,B=(c,t,a)=>`<button class="btn ${c} big" onclick="${a}">${t}</button>`;
  let b='';
  if(st.phase=='q')b=B('green','Bonne réponse directe (5 pts)',"cmd('ans',5)")+B('pink','Mauvaise réponse (0 pt)',"cmd('ans',0)")+B('','Afficher les 4 propositions',"cmd('show')");
  else if(st.phase=='m')b=B('green','Bonne réponse (3 pts)',"cmd('ans',3)")+B('pink','Mauvaise réponse (0 pt)',"cmd('ans',0)")+B('','50/50',"cmd('fifty')");
  else if(st.phase=='f')b=B('green','Bonne réponse (1 pt)',"cmd('ans',1)")+B('pink','Mauvaise réponse (0 pt)',"cmd('ans',0)");
  else b=`<div class="anec"><b>${st.pts?'+'+plural(st.pts,'point'):'0 point'} pour ${esc(st.teams[st.ti].n)}</b><p>Le saviez-vous ? ${esc(q.f)}</p></div>`+B('',st.last?'Voir le classement final':'Question suivante',"cmd('next')");
  return `<div class="grid"><main>${head(st)}<section class="card"><p class="lvl">Niveau ${q.l} · ${LV[q.l-1]}</p><h2 class="q">${esc(q.q)}</h2>
  <p class="exp">Réponse attendue : <b>${esc(q.a)}</b></p>${optsHTML(st,true)}<div class="acts">${b}</div></section><button class="btn mut" style="margin-top:14px" onclick="if(confirm('Mettre la partie en pause ? Elle restera enregistrée.'))cmd('pause')">Mettre en pause</button></main>${board({...st,i0:st.ti},true)}</div>`;
}
function render(){
  $('#meta').textContent='';
  const a=$('#app');
  if(TV){const s=pub();a.innerHTML=scr=='game'&&s?lostBar()+tvGame(s):scr=='end'&&s?endHTML(s,false):tvWait()}
  else if(scr=='conn')a.innerHTML=`<div class="card"><h3>Connexion à l'écran principal…</h3><p class="st">Serveur de connexion : ${pOk?'✓ joint':'en cours…'}</p><p class="st">Écran TV : ${cOk?'✓ trouvé':'en recherche…'}</p>${Date.now()-t0>12000?'<p class="sub">Pas de réponse de l\'écran TV. Vérifiez que sa page est ouverte, puis touchez Relancer.</p><button class="btn" onclick="say({t:\'hello\'})">Relancer</button>':''}</div>`;
  else if(scr=='lost')a.innerHTML=`<div class="card"><h3>Connexion perdue</h3><p>Reconnexion automatique en cours. Vérifiez que l'écran TV est ouvert.</p>${err?`<p class="sub">${esc(err)}</p>`:''}<button class="btn big" onclick="location.reload()">Reconnecter</button></div>`;
  else if(scr=='cfgd'||!st)a.innerHTML=renderSetup();
  else a.innerHTML=scr=='end'?endHTML(st,true):ctlGame(st);
}
if(TV)loadS();render();TV?tvInit():ctlInit();
if(!TV)setInterval(()=>{if(scr=='conn')render()},1000);
</script>
</body>
</html>
